[package]
name = "wtengine"
version = "0.4.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WhoSees Android capture engine: local VPN packets -> real sockets, with the desktop agent's analysis"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ipstack = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
jni = "0.21"
libc = "0.2"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
panic = "abort"

[patch.crates-io]
# ipstack 1.0.1 with TCP half-close / FIN fixes (see vendor/ipstack/WHOSEES-CHANGES.md)
ipstack = { path = "vendor/ipstack" }
