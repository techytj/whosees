[workspace]
resolver = "2"
members = ["sslcap-ebpf", "objbuild"]
default-members = ["objbuild"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"

[workspace.dependencies]
aya-ebpf = { version = "0.2.1", default-features = false }
aya-build = { version = "0.2.0", default-features = false }
anyhow = "1"
cargo_metadata = { version = "0.23.0", default-features = false }
which = { version = "6.0.0", default-features = false }

[profile.release.package.sslcap-ebpf]
debug = 2
codegen-units = 1
strip = false
