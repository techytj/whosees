[package]
name = "whosees-agent"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "WhoSees capture agent: reports outgoing connections as JSON lines"

[dependencies]
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
ferrisetw = "1.2"
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Dns",
  "Win32_Networking_WinSock", "Win32_System_Threading", "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
lto = true
strip = true
